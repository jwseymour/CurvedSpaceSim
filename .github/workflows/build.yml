name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Render scenes headlessly (smoke test)
        run: ./gradlew run -PmainClass=com.curvedspace.app.RenderScenes --args="build/render"
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
